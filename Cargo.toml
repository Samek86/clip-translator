[package]
name = "clip-translator"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Windows tray clipboard translator (DeepL / Azure Translator)"
license = "MIT"
authors = ["Jun"]
publish = false

[package.metadata.slint]
style = "fluent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
# Schannel (native-tls on Windows) so the cross build does not need aws-lc or a C toolchain.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
arboard = "3"
winreg = "0.55"
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"

[profile.release]
strip = true
lto = false
